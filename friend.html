<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outfit Recommender</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/friend.js" defer></script>
  </head>
  <body data-theme="winter">
    <main class="app-shell friend-page">
      <header class="app-header">
        <h1>Outfit Recommendation Builder</h1>
        <p>Select one piece from every category.</p>
      </header>

      <form id="recommendation-form">
        <label>
          Your name
          <input name="author" type="text" placeholder="Optional">
        </label>

        <div class="builder-layout">
          <aside class="outfit-preview" aria-label="Selected outfit">
            <h2>Selected outfit</h2>
            <div class="preview-item" data-category="hoodies"></div>
            <div class="preview-item" data-category="shirts"></div>
            <div class="preview-item" data-category="pants"></div>
            <div class="preview-item" data-category="shoes"></div>
            <button type="submit">Send recommendation</button>
          </aside>

          <div class="builder-options">
            <fieldset class="item-category">
              <legend>Hoodies / sweaters</legend>
              <div id="hoodies-options" class="item-options"></div>
            </fieldset>
            <fieldset class="item-category">
              <legend>Shirts</legend>
              <div id="shirts-options" class="item-options"></div>
            </fieldset>
            <fieldset class="item-category">
              <legend>Pants</legend>
              <div id="pants-options" class="item-options"></div>
            </fieldset>
            <fieldset class="item-category">
              <legend>Shoes</legend>
              <div id="shoes-options" class="item-options"></div>
            </fieldset>
          </div>
        </div>
      </form>

      <p id="recommendation-status" aria-live="polite"></p>
    </main>
  </body>
</html>
